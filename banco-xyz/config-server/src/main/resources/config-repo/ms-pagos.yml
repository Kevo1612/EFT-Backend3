server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/pagos_db
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco123}
    hikari:
      maximum-pool-size: 15
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        # ms-pagos obtiene un token con rol SERVICIO: es el UNICO autorizado a mover saldos en ms-cuentas
        registration:
          keycloak:
            client-id: ms-pagos
            client-secret: ${MS_PAGOS_SECRET:ms-pagos-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${banco.security.token-uri}

banco:
  pagos:
    max-intentos: 5
    reproceso-ms: 30000
    fraude:
      umbral-monto: 5000000
      max-retiros-ventana: 3
      ventana-minutos: 10
