# =====================================================================
# Politicas de resiliencia COMPARTIDAS (Resilience4j).
# La cargan los servicios que llaman a otros servicios via Feign
# (ms-cuentas, ms-pagos, bff-web, bff-movil, bff-cajero) declarando:
#   spring.cloud.config.name: ${spring.application.name},resiliencia
# Se separa de application.yml porque referencia clases de Feign que
# el gateway y el batch no tienen en su classpath.
# =====================================================================
resilience4j:
  circuitbreaker:
    # orden: CircuitBreaker( Retry( llamada ) ) -> el circuito evalua el resultado final tras reintentos
    circuit-breaker-aspect-order: 1
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # errores de negocio (4xx) NO cuentan como falla del servicio
        ignore-exceptions:
          - feign.FeignException$FeignClientException
          - cl.bancoxyz.common.web.NegocioException
  retry:
    retry-aspect-order: 2
    configs:
      default:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
          - java.io.IOException
        ignore-exceptions:
          - feign.FeignException$FeignClientException
          - cl.bancoxyz.common.web.NegocioException

